name: Keep Supabase awake

# WHY THIS EXISTS
# The booking backend runs on Supabase's free plan, which automatically PAUSES
# the project after ~7 days without activity. While paused, the website can't
# load availability or take bookings ("Couldn't reach the server").
#
# This workflow pings the booking function twice a day. The ping runs a real
# availability check, which touches the database — that steady activity keeps
# the project awake so it never pauses. It's free and needs no attention.
#
# NOTE: GitHub only runs scheduled workflows from the default branch (main),
# and may disable schedules after 60 days with no repo activity — a commit
# re-enables them.

on:
  schedule:
    - cron: '17 8 * * *'    # 08:17 UTC daily
    - cron: '17 20 * * *'   # 20:17 UTC daily
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the bb-bookings function
        run: |
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -d '{"action":"slots"}' \
            "https://qqkxxywdlqqkipioycaq.supabase.co/functions/v1/bb-bookings" \
            -o /dev/null -w "Pinged backend — HTTP %{http_code}\n"
